<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pra onde eu vou - Guia de Eventos</title>
  <meta name="description" content="Guia exclusivo de eventos, shows, festas e bailes do Estado de São Paulo (SP)." />
  <meta property="og:title" content="Pra onde eu vou" />
  <meta property="og:description" content="Descubra shows, bailes, samba e os melhores eventos perto de você." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://praondeeuvou.ia.br" />
  <meta property="og:image" content="https://ais-pre-qs2o4mzsw3wxjtqbewcb3i-856757906261.us-east1.run.app/pwa-512x512.png" />
  <meta name="theme-color" content="#0b0d17" />
  <link rel="icon" type="image/png" href="https://ais-pre-qs2o4mzsw3wxjtqbewcb3i-856757906261.us-east1.run.app/pwa-192x192.png" />
  <link rel="apple-touch-icon" href="https://ais-pre-qs2o4mzsw3wxjtqbewcb3i-856757906261.us-east1.run.app/apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #0b0d17 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
    }
    .logo {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      margin: 0 auto 16px;
      display: block;
      border: 2px solid rgba(245, 158, 11, 0.65);
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    h1 span { color: #f59e0b; }
    p { font-size: 14px; color: #cbd5e1; line-height: 1.5; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 16px;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      color: #0f172a;
      font-weight: 800;
      font-size: 15px;
      text-decoration: none;
    }
    .tip {
      margin-top: 14px;
      font-size: 12px;
      color: #fde68a;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 12px;
      padding: 10px 12px;
      display: none;
    }
  </style>
  <script>
    (function () {
      var targetUrl = 'https://ais-pre-qs2o4mzsw3wxjtqbewcb3i-856757906261.us-east1.run.app';
      var ua = navigator.userAgent || '';
      var isInAppBrowser = /Instagram|FBAN|FBAV|FB_IAB/i.test(ua);
      if (!isInAppBrowser) {
        window.location.replace(targetUrl);
      } else {
        window.addEventListener('DOMContentLoaded', function () {
          var tip = document.getElementById('inapp-tip');
          var msg = document.getElementById('redirect-msg');
          if (tip) tip.style.display = 'block';
          if (msg) msg.textContent = 'Para abrir sem bloqueios e gravar o ícone no celular, abra no Chrome ou Safari:';
        });
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://ais-pre-qs2o4mzsw3wxjtqbewcb3i-856757906261.us-east1.run.app/pwa-512x512.png" alt="Pra onde eu vou" />
    <h1>Pra onde eu <span>vou</span>?</h1>
    <p id="redirect-msg">Abrindo o aplicativo...</p>
    <a class="btn" href="https://ais-pre-qs2o4mzsw3wxjtqbewcb3i-856757906261.us-east1.run.app">
      Abrir Aplicativo Agora
    </a>
    <div id="inapp-tip" class="tip">
      Você está dentro do navegador do Instagram. Toque nos <strong>3 pontinhos (⋮)</strong> no canto superior (ou no ícone de navegador embaixo no iPhone) e escolha <strong>"Abrir no navegador"</strong>.
    </div>
  </div>
</body>
</html>
